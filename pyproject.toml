[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlsxnetos"
version = "0.1.0"
description = "Network operating system toolkit for Ubuntu and Debian"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "cryptography>=42.0"]

[project.scripts]
nlsxnetos = "tools.router_cli.commands:main"

[tool.setuptools.packages.find]
include = ["init*", "kernel*", "net*", "nls*", "security*", "services*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires root and Linux network namespaces"]

[tool.ruff]
line-length = 100
