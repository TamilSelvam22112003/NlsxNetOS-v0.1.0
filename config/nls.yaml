nls:
  enabled: false
  auto_router_ca: true
  router_ca:
    server_url: ""
    ca_file: ""
    timeout_seconds: 5
    bearer_token: ""
  protocol_version: 1
  router_id: nls-router
  identity_key: /var/lib/nlsxnetos/identity/ed25519.key
  encryption_private_key: /var/lib/nlsxnetos/identity/rsa-encryption.pem
  listen_address: "::"
  listen_port: 4789
  # Optional Linux interface used for NLS UDP transport. Empty = normal kernel routing.
  bind_interface: ""
  replay_window: 64
  max_clock_skew_seconds: 120
  session_timeout_seconds: 300
  peer_block_seconds: 60
  tun:
    enabled: false
    name: nls0
    mtu: 1280
  peers: []
