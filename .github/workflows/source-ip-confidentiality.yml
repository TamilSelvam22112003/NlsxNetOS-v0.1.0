name: Source IP confidentiality regression

on:
  push:
    branches:
      - "fix/source-ip-hop-confidentiality-2026-10"
  pull_request:
    branches:
      - "security/pentest-audit-2026-10"
    paths:
      - "nls/source_token.py"
      - "nls/v2_runtime.py"
      - "nls/daemon.py"
      - "tests/security/test_source_ip_hop_confidentiality.py"
      - ".github/workflows/source-ip-confidentiality.yml"

permissions:
  contents: read

jobs:
  source-ip-confidentiality:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check cryptography pytest
      - name: Verify hop-by-hop source IP confidentiality
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/security/test_source_ip_hop_confidentiality.py
