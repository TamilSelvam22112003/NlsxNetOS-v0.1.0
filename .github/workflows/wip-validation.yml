name: NLS WIP Validation

on:
  push:
    branches:
      - wip/nls-rdr-vip-hardening

permissions:
  contents: read

concurrency:
  group: nls-wip-validation-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-security:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-utils frr frr-pythontools iproute2 iputils-ping nftables python3-yaml python3-cryptography python3-cbor2 python3-pytest shellcheck
      - name: Python syntax
        run: python3 -m compileall -q init kernel net nls security services tools tests
      - name: Focused RDR, vIP, and NLH2 tests
        run: |
          set -o pipefail
          PYTHONPATH="$PWD" timeout --signal=TERM --kill-after=15s 10m python3 -m pytest -q \
            tests/unit/test_nls_directory_cache.py \
            tests/unit/test_vip_derivation.py \
            tests/unit/test_nls_v2_primitives.py \
            tests/unit/test_nls_handshake.py \
            tests/security/test_nlh2_acceptance.py

  six-node-functional:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Router-CA source for the real lab
        run: git clone --depth 1 --branch feat/nls-v1 https://github.com/TamilSelvam22112003/Nls-NexOS-Core-v0.1.0.git ../Nls-NexOS-Core-v0.1.0
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y frr frr-pythontools iproute2 iputils-ping iperf3 tcpdump python3-venv python3-pip
      - name: Install both repositories in an isolated lab environment
        run: |
          python3 -m venv /tmp/nls-lab-venv
          /tmp/nls-lab-venv/bin/python -m pip install --disable-pip-version-check -e . -e ../Nls-NexOS-Core-v0.1.0 -r requirements.txt
      - name: Six-node NLH2 functional/security lab (no performance gates)
        run: |
          sudo -E env PYTHONPATH="$PWD" /tmp/nls-lab-venv/bin/python -m pytest -q -s tests/integration/test_four_node_nls.py -m integration
