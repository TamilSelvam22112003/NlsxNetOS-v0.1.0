name: NlsxNetOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify release tag is based on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
      - name: Build
        run: ./scripts/build-deb.sh
      - name: Hash
        run: sha256sum dist/nlsxnetos_0.1.0_all.deb > dist/SHA256SUMS
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/nlsxnetos_0.1.0_all.deb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             dist/nlsxnetos_0.1.0_all.deb             dist/SHA256SUMS             --generate-notes
