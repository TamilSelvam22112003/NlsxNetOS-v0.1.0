name: NlsxNetOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
      - name: Build
        run: ./scripts/build/deb.sh
      - name: Hash
        run: sha256sum dist/nlsxnetos_0.1.0_all.deb > dist/SHA256SUMS
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/nlsxnetos_0.1.0_all.deb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             dist/nlsxnetos_0.1.0_all.deb             dist/SHA256SUMS             --generate-notes
