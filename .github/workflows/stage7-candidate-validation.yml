name: Stage 7 Candidate Validation

on:
  push:
    branches:
      - spec/normative-stage7-locator-precedence
  pull_request:
    branches:
      - work/ospfv3-full-nls-lifecycle
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit and security tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Checkout matching NexOS Core candidate
        uses: actions/checkout@v4
        with:
          repository: TamilSelvam22112003/Nls-NexOS-Core-v0.1.0
          ref: a5f914091246672895bf88c454f0865477880406
          path: core
      - name: Assert reproducible Core candidate pin
        run: test "$(git -C core rev-parse HEAD)" = "a5f914091246672895bf88c454f0865477880406"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r core/requirements.txt
          python -m pip install -e .
          python -m pip install -e core
      - name: Verify Stage 7 specification precedence
        run: python -m pytest -q tests/security/test_stage7_spec_precedence.py tests/spec/test_stage7_spec_pair_consistency.py
      - name: Run NetOS unit and security suites
        run: python -m pytest -q tests/unit tests/security
      - name: Run cross-repository control protocol compatibility tests
        run: python -m pytest -q tests/integration/test_nls_control_protocol_compatibility.py
      - name: Lint specification regression tests
        run: python -m ruff check tests/security/test_stage7_spec_precedence.py tests/spec/test_stage7_spec_pair_consistency.py

  frr-ospfv3-invariance:
    name: FRR OSPFv3 invariance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FRR and network utilities
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y frr iproute2 iputils-ping
      - name: Install NetOS test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run real FRR OSPFv3 startup/shutdown invariance test
        run: sudo -E "$(which python)" -m pytest -q tests/integration/test_ospfv3_nls_invariance.py
