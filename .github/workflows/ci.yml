name: NlsxNetOS CI

on:
  push:
    branches: [main, develop, fix/frr-debian-packaging]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Package and test
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
      - name: Build Debian package
        run: dpkg-deb --build packaging/deb nlsxnetos_0.1.0_all.deb
      - name: Reject FRR-owned files
        run: |
          ! dpkg-deb -c nlsxnetos_0.1.0_all.deb | grep -Eq '/etc/frr/(daemons|vtysh\.conf)$'
      - name: Install FRR first
        run: |
          sudo apt-get update
          sudo apt-get install -y frr frr-pythontools
      - name: Install NlsxNetOS package
        run: sudo apt-get install -y ./nlsxnetos_0.1.0_all.deb
      - name: Validate package state
        run: |
          dpkg -l nlsxnetos frr
          test -z "$(dpkg --audit)"
          systemctl is-enabled frr
          systemctl is-active frr
      - name: Python tests
        run: |
          python3 -m pip install -r requirements.txt
          pytest -v
