name: NlsxNetOS CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install pytest pytest-cov

      - name: Install NlsxNetOS
        run: |
          python -m pip install -e .

      - name: Python compile check
        run: |
          python -m compileall nlsxnetos

      - name: Run tests
        run: |
          pytest -v

      - name: Test CLI
        run: |
          python -m nlsxnetos --help
